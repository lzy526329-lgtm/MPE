name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            files: |
              release/**/*.dmg
              release/**/*.zip
          - os: windows-latest
            command: package:win
            files: |
              release/**/*.exe
          - os: ubuntu-latest
            command: package:linux
            files: |
              release/**/*.AppImage
              release/**/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: npx tsc --version && npx vite --version

      - name: Build installers
        run: npm run ${{ matrix.command }}
        env:
          # 无证书时关闭自动签名。不要设置空的 CSC_LINK，否则 mac 会报 “not a file”
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPT-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish releases
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        id: meta
        run: |
          mkdir -p dist-out
          # 优先安装包本体；mac 额外保留 zip 方便无 dmg 场景
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "dist-out/$(basename "$file")"
          done
          ls -lah dist-out
          test -n "$(ls -A dist-out)"

          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Collected for ${TAG}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MPT ${{ steps.meta.outputs.tag }}
          files: dist-out/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: true
          fail_on_unmatched_files: true

      - name: Publish Gitee Release
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          OWNER="${GITEE_OWNER:-li_ziyang}"
          REPO="${GITEE_REPO:-gongju}"
          chmod +x scripts/publish-gitee-release.sh
          mapfile -t FILES < <(find dist-out -type f | sort)
          ./scripts/publish-gitee-release.sh \
            "$OWNER" \
            "$REPO" \
            "${{ steps.meta.outputs.tag }}" \
            "${FILES[@]}"
