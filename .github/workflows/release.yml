name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE_ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "MPT ${TAG}" \
              --latest \
              "${PRERELEASE_ARGS[@]}" || true
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "MPT ${TAG}" \
              --generate-notes \
              --latest \
              "${PRERELEASE_ARGS[@]}"
          fi

  # 直接上传到 GitHub Release，避免占用 Actions Artifact 配额
  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            patterns: |
              release/*/MPT-*.dmg
              release/*/MPT-*.zip
              release/*/latest-mac.yml
              release/*/*.blockmap
          - os: windows-latest
            command: package:win
            patterns: |
              release/*/MPT-*-win-*.exe
              release/*/latest.yml
              release/*/*.blockmap
          - os: ubuntu-latest
            command: package:linux
            patterns: |
              release/*/MPT-*.AppImage
              release/*/MPT-*.deb
              release/*/latest-linux.yml
              release/*/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: npx tsc --version && npx vite --version

      - name: Build installers
        run: npm run ${{ matrix.command }}
        env:
          # 无证书时关闭自动签名。不要设置空的 CSC_LINK，否则 mac 会报 “not a file”
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist-out
          while IFS= read -r pattern; do
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            [[ -z "$pattern" ]] && continue
            shopt -s nullglob
            for file in $pattern; do
              [[ -f "$file" ]] || continue
              cp "$file" "dist-out/$(basename "$file")"
            done
            shopt -u nullglob
          done <<< "${{ matrix.patterns }}"

          echo "==== dist-out ===="
          ls -lah dist-out
          test -n "$(ls -A dist-out 2>/dev/null)"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" dist-out/* \
            --repo "${{ github.repository }}" \
            --clobber

  publish-gitee:
    name: Sync Gitee Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-out
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist-out \
            --pattern 'MPT-*' || true
          echo "==== dist-out ===="
          ls -lah dist-out || true

      - name: Publish Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 同步（可在仓库 Secrets 中添加）"
            exit 0
          fi
          if [ -z "$(ls -A dist-out 2>/dev/null)" ]; then
            echo "没有可同步的文件，跳过"
            exit 0
          fi
          OWNER="${GITEE_OWNER:-li_ziyang}"
          REPO="${GITEE_REPO:-gongju}"
          chmod +x scripts/publish-gitee-release.sh
          mapfile -t FILES < <(find dist-out -type f -name 'MPT-*' | sort)
          ./scripts/publish-gitee-release.sh \
            "$OWNER" \
            "$REPO" \
            "${{ needs.prepare.outputs.tag }}" \
            "${{ github.repository }}" \
            "${FILES[@]}"
