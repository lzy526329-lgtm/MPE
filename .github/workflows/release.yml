name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            files: |
              release/**/*.dmg
              release/**/*.zip
          - os: windows-latest
            command: package:win
            files: |
              release/**/*.exe
          - os: ubuntu-latest
            command: package:linux
            files: |
              release/**/*.AppImage
              release/**/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: npx tsc --version && npx vite --version

      - name: Build installers
        run: npm run ${{ matrix.command }}
        env:
          # 无证书时关闭自动签名。不要设置空的 CSC_LINK，否则 mac 会报 “not a file”
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPT-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Upload tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
